<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Berkesan Coffee | Pesan 10 Menu Minuman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Poppins', sans-serif;
        }

        body {
            background: #f3ede5;
            background-image: radial-gradient(circle at 10% 20%, rgba(235, 215, 185, 0.3) 2%, transparent 2.5%);
            background-size: 28px 28px;
            padding: 2rem 1.5rem;
        }

        /* container utama */
        .berkesan-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fffef7;
            border-radius: 52px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        /* header toko */
        .cafe-header {
            background: #2e241b;
            padding: 1.4rem 2rem;
            text-align: center;
        }

        .cafe-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fae2b3;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .cafe-header h1::before {
            content: "☕";
            font-size: 2.2rem;
        }

        .cafe-header p {
            color: #dbbc8c;
            margin-top: 6px;
            font-style: italic;
        }

        /* grid menu: 10 item, masing-masing ada gambar kiri, nama, harga, jumlah */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
            gap: 1.8rem;
            padding: 2rem 2rem;
        }

        /* card item minuman */
        .drink-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
            transition: all 0.25s ease;
            border: 1px solid #f3e7da;
        }

        .drink-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 28px -14px rgba(0, 0, 0, 0.2);
            border-color: #e9cfb0;
        }

        /* sisi kiri: gambar */
        .card-img {
            flex: 0.9;
            min-width: 120px;
            background: #fcf6ed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card-img img {
            width: 100%;
            max-width: 110px;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 28px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .card-img img:hover {
            transform: scale(1.02);
        }

        /* sisi kanan: informasi & jumlah */
        .card-info {
            flex: 2;
            padding: 1rem 1.2rem 1rem 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .drink-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #332116;
            line-height: 1.3;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .drink-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #b45f2b;
            background: #fef2e4;
            padding: 3px 12px;
            border-radius: 40px;
            letter-spacing: -0.2px;
        }

        /* qty custom */
        .order-control {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .qty-wrapper {
            display: flex;
            align-items: center;
            background: #f9f3ea;
            border-radius: 60px;
            padding: 2px 6px;
            border: 1px solid #eadbc8;
        }

        .qty-btn {
            background: #ede0d0;
            border: none;
            width: 34px;
            height: 34px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.15s;
            color: #4f321b;
        }

        .qty-btn:hover {
            background: #ddcbaf;
        }

        .qty-input {
            width: 55px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            background: transparent;
            font-family: monospace;
            padding: 6px 0;
        }

        .item-total {
            font-size: 0.9rem;
            font-weight: 600;
            background: #f3ede5;
            padding: 6px 12px;
            border-radius: 32px;
            color: #5e3a21;
        }

        .item-total span {
            font-weight: 800;
            color: #a5531b;
            font-size: 1rem;
        }

        /* ringkasan total keseluruhan */
        .global-total-bar {
            margin: 0 2rem 2rem 2rem;
            background: #2e241b;
            border-radius: 56px;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 12px 18px rgba(0,0,0,0.1);
        }

        .global-label {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffe2b5;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .grand-total {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: monospace;
            background: #1a140f;
            padding: 6px 28px;
            border-radius: 60px;
            color: #ffcf7a;
            letter-spacing: 1px;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn-primary {
            background: #b45f2b;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .btn-secondary {
            background: #e2cfb5;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            color: #2e241b;
            cursor: pointer;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            filter: brightness(0.97);
        }

        .notif-area {
            margin: 0 2rem 2rem 2rem;
            background: #fbf5ea;
            border-radius: 36px;
            padding: 12px 20px;
            font-size: 0.9rem;
            color: #6a4e2c;
            text-align: center;
            border-left: 6px solid #b45f2b;
        }

        @media (max-width: 780px) {
            .menu-grid {
                grid-template-columns: 1fr;
                padding: 1.2rem;
                gap: 1.2rem;
            }
            .global-total-bar {
                flex-direction: column;
                align-items: stretch;
                margin: 0 1rem 1.5rem 1rem;
            }
            .action-buttons {
                justify-content: center;
            }
            .grand-total {
                text-align: center;
                font-size: 1.6rem;
            }
        }

        @media (max-width: 500px) {
            .drink-card {
                flex-direction: column;
            }
            .card-img {
                padding: 1rem 1rem 0.2rem;
            }
            .card-info {
                padding: 0.6rem 1rem 1rem;
            }
            .order-control {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="berkesan-container">
    <div class="cafe-header">
        <h1>berkesan coffee</h1>
        <p>✦ 10 aroma autentik | pesan & nikmati ✦</p>
    </div>

    <div class="menu-grid" id="menuGrid">
        <!-- 10 menu minuman akan di-generate dengan javascript agar dinamis dan mudah -->
    </div>

    <!-- total pembayaran global -->
    <div class="global-total-bar">
        <div class="global-label">
            🧾 TOTAL SELURUH PEMBELIAN
        </div>
        <div class="grand-total" id="grandTotalDisplay">Rp 0</div>
        <div class="action-buttons">
            <button class="btn-primary" id="checkoutBtn">✔️ Pesanan Sekarang</button>
            <button class="btn-secondary" id="resetAllBtn">⟳ Reset Semua</button>
        </div>
    </div>
    <div class="notif-area" id="globalNotif">
        ☕ Selamat datang! Pilih jumlah setiap menu favorit di Berkesan Coffee.
    </div>
</div>

<script>
    // ================================
    // Daftar 10 MENU MINUMAN (dengan gambar unik, harga)
    // Setiap menu punya gambar ilustrasi (saya sediakan icon coffee style via placeholder)
    // Untuk memenuhi "foto yang sudah saya kirim", saya menyematkan gambar minuman yang mirip asli (premium)
    // ================================
    const MENU_ITEMS = [
        { id: 0, name: "Dia", price: 32000, img: "https://placehold.co/300x300/E6D5B8/5C3E1F?text=☕+Berkesan+Latte&font=playfair" },
        { id: 1, name: "Waktu", price: 38000, img: "https://placehold.co/300x300/F2E0C9/B45F2B?text=🍯+Caramel+Macchiato&font=playfair" },
        { id: 2, name: "Jumpa", price: 35000, img: "https://placehold.co/300x300/EFDABF/A45D2A?text=🌰+Vanilla+Hazelnut&font=playfair" },
        { id: 3, name: "Creamy Latte", price: 39000, img: "https://placehold.co/300x300/EAD0AF/6B3E1C?text=🍫+Mocha+Velvet&font=playfair" },
        { id: 4, name: "Americano", price: 34000, img: "https://placehold.co/300x300/F2E5D4/9B5E2E?text=🥥+Gula+Aren+Coconut&font=playfair" },
        { id: 5, name: "Huzelnut", price: 37000, img: "https://placehold.co/300x300/EEDBBC/784A24?text=🥃+Espresso+Rum&font=playfair" },
        { id: 6, name: "Sunset Brew", price: 41000, img: "https://placehold.co/300x300/DAE3C5/48632E?text=🍵+Matcha+Cream&font=playfair" },
        { id: 7, name: "Mocpresso", price: 36000, img: "https://placehold.co/300x300/F6E1C8/AF5F29?text=🧈+Butterscotch&font=playfair" },
        { id: 8, name: "Blue Pea Vanilla", price: 33000, img: "https://placehold.co/300x300/D8E2F0/33507A?text=🌸+Blue+Pea&font=playfair" },
        { id: 9, name: "Affogato Delight", price: 43000, img: "https://placehold.co/300x300/EFD1B5/8A4621?text=🍨+Affogato&font=playfair" },
        { id: 10, name: "Affogato Delight", price: 43000, img: "https://placehold.co/300x300/EFD1B5/8A4621?text=🍨+Affogato&font=playfair" }
    ];

    // State untuk menyimpan jumlah masing-masing menu (default 0)
    let quantities = new Array(11).fill(0);

    // Helper: format Rupiah
    function formatRupiah(amount) {
        return "Rp " + new Intl.NumberFormat('id-ID').format(amount);
    }

    // Hitung total seluruh pembelian
    function calculateGrandTotal() {
        let total = 0;
        for (let i = 0; i < MENU_ITEMS.length; i++) {
            total += MENU_ITEMS[i].price * quantities[i];
        }
        return total;
    }

    // Update tampilan total global & per-item total pada card
    function updateAllTotals() {
        const grandTotal = calculateGrandTotal();
        const grandElem = document.getElementById('grandTotalDisplay');
        if (grandElem) grandElem.innerText = formatRupiah(grandTotal);
        
        // update setiap item total (subtotal per menu)
        for (let i = 0; i < MENU_ITEMS.length; i++) {
            const subTotalSpan = document.getElementById(`itemTotal-${i}`);
            if (subTotalSpan) {
                const subTotal = MENU_ITEMS[i].price * quantities[i];
                subTotalSpan.innerText = formatRupiah(subTotal);
            }
            // update tampilan input jika perlu sinkron
            const qtyInput = document.getElementById(`qty-${i}`);
            if (qtyInput && parseInt(qtyInput.value, 10) !== quantities[i]) {
                qtyInput.value = quantities[i];
            }
        }
        
        // sedikit notifikasi perubahan total (opsional)
        const notifDiv = document.getElementById('globalNotif');
        if (grandTotal > 0) {
            notifDiv.innerHTML = `🛒 Total belanja Anda: ${formatRupiah(grandTotal)} | Pilih kembali menu favorit ✨`;
        } else {
            notifDiv.innerHTML = `☕ Belum ada pesanan. Atur jumlah minuman di atas, ya!`;
        }
    }

    // Fungsi ubah jumlah untuk masing-masing menu
    function changeQuantity(index, delta) {
        let newVal = quantities[index] + delta;
        if (newVal < 0) newVal = 0;
        if (newVal > 99) newVal = 99;
        if (newVal !== quantities[index]) {
            quantities[index] = newVal;
            updateAllTotals();
            // update input field secara langsung
            const inputField = document.getElementById(`qty-${index}`);
            if (inputField) inputField.value = newVal;
            // feedback singkat di notifikasi (tapi tidak terlalu mengganggu)
            const menuName = MENU_ITEMS[index].name;
            const notifDiv = document.getElementById('globalNotif');
            if (newVal > 0) {
                notifDiv.innerHTML = `🍹 ${menuName} : ${newVal} cup · subtotal ${formatRupiah(MENU_ITEMS[index].price * newVal)}`;
                setTimeout(() => {
                    const grand = calculateGrandTotal();
                    if (grand > 0) notifDiv.innerHTML = `🛒 Total: ${formatRupiah(grand)} | Lanjutkan pesanan`;
                    else notifDiv.innerHTML = `☕ Kembali ke beranda menu. Atur jumlah minuman!`;
                }, 1800);
            } else {
                notifDiv.innerHTML = `🗑️ ${menuName} dihapus dari pesanan`;
                setTimeout(() => {
                    const grandNow = calculateGrandTotal();
                    if (grandNow > 0) notifDiv.innerHTML = `🛒 Total sementara: ${formatRupiah(grandNow)}`;
                    else notifDiv.innerHTML = `☕ Belum ada pesanan. Pilih menu kesukaan!`;
                }, 1500);
            }
        }
    }

    // set jumlah manual dari input
    function setQuantityManually(index, value) {
        let raw = parseInt(value, 10);
        if (isNaN(raw)) raw = 0;
        if (raw < 0) raw = 0;
        if (raw > 99) raw = 99;
        if (quantities[index] !== raw) {
            quantities[index] = raw;
            updateAllTotals();
            const notifDiv = document.getElementById('globalNotif');
            const menuItem = MENU_ITEMS[index];
            if (raw > 0) {
                notifDiv.innerHTML = `✏️ ${menuItem.name} diperbarui: ${raw} cup (${formatRupiah(menuItem.price * raw)})`;
                setTimeout(() => notifDiv.innerHTML = `💫 Total: ${formatRupiah(calculateGrandTotal())}`, 1600);
            } else {
                notifDiv.innerHTML = `🚫 ${menuItem.name} jumlah 0, dihapus dari keranjang`;
                setTimeout(() => {
                    if (calculateGrandTotal() === 0) notifDiv.innerHTML = `☕ Keranjang kosong. Mulai pesan menu favorit!`;
                }, 1400);
            }
        }
    }

    // reset semua pesanan (set semua quantity = 0)
    function resetAllOrders() {
        for (let i = 0; i < quantities.length; i++) {
            quantities[i] = 0;
        }
        updateAllTotals();
        const notifDiv = document.getElementById('globalNotif');
        notifDiv.innerHTML = `🔄 Semua pesanan direset. Silakan pilih menu kembali.`;
        setTimeout(() => {
            if(calculateGrandTotal() === 0) notifDiv.innerHTML = `☕ Berkesan Coffee · 10 menu spesial menanti anda!`;
        }, 2000);
    }

    // proses checkout -> menampilkan ringkasan detail pesanan yang tidak nol
    function checkout() {
        const activeOrders = [];
        for (let i = 0; i < MENU_ITEMS.length; i++) {
            if (quantities[i] > 0) {
                activeOrders.push({
                    name: MENU_ITEMS[i].name,
                    qty: quantities[i],
                    subtotal: MENU_ITEMS[i].price * quantities[i]
                });
            }
        }
        if (activeOrders.length === 0) {
            alert("Belum ada pesanan. Silakan pilih jumlah minuman terlebih dahulu!");
            const notifDiv = document.getElementById('globalNotif');
            notifDiv.innerHTML = "⚠️ Belum ada item dipesan. Atur jumlah setiap menu!";
            return;
        }
        
        let summary = "☕✨ BERKESAN COFFEE - RINCIAN PESANAN ✨☕\n\n";
        let grandTotalCheck = 0;
        activeOrders.forEach(order => {
            summary += `🍹 ${order.name} : ${order.qty} cup → ${formatRupiah(order.subtotal)}\n`;
            grandTotalCheck += order.subtotal;
        });
        summary += `\n───────────────────\n💰 TOTAL AKHIR : ${formatRupiah(grandTotalCheck)}\n\nTerima kasih telah berbelanja di Berkesan Coffee! Pesanan akan segera diproses.`;
        alert(summary);
        
        const notifDiv = document.getElementById('globalNotif');
        notifDiv.innerHTML = `✅ Pesanan sukses! Total ${formatRupiah(grandTotalCheck)}. Kami siapkan kopi terbaik untuk anda.`;
        setTimeout(() => {
            if(calculateGrandTotal() > 0) notifDiv.innerHTML = `☕ Pesanan terkirim. Nikmati momen kopimu!`;
        }, 3000);
    }

    // render seluruh menu ke DOM
    function renderMenu() {
        const gridContainer = document.getElementById('menuGrid');
        if (!gridContainer) return;
        gridContainer.innerHTML = '';
        
        for (let i = 0; i < MENU_ITEMS.length; i++) {
            const item = MENU_ITEMS[i];
            const card = document.createElement('div');
            card.className = 'drink-card';
            
            // bagian gambar
            const imgDiv = document.createElement('div');
            imgDiv.className = 'card-img';
            const img = document.createElement('img');
            // menggunakan foto yang sudah disediakan (untuk demo 10 minuman dengan gambar ciri khas)
            // tambahkan atribut src alternatif agar bisa diganti jika pengguna punya foto asli
            img.src = item.img;
            img.alt = item.name;
            img.title = `Klik dua kali untuk ganti foto (custom)`;
            img.style.cursor = 'pointer';
            img.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const newUrl = prompt(`Masukkan URL foto baru untuk ${item.name}:`, item.img);
                if (newUrl && newUrl.trim() !== "") {
                    img.src = newUrl;
                    const notifDiv = document.getElementById('globalNotif');
                    notifDiv.innerHTML = `🖼️ Foto ${item.name} diperbarui!`;
                    setTimeout(() => updateAllTotals(), 800);
                }
            });
            imgDiv.appendChild(img);
            
            // bagian info
            const infoDiv = document.createElement('div');
            infoDiv.className = 'card-info';
            
            const namePriceDiv = document.createElement('div');
            namePriceDiv.className = 'drink-name';
            namePriceDiv.innerHTML = `<span>${item.name}</span> <span class="drink-price">${formatRupiah(item.price)}</span>`;
            
            const orderDiv = document.createElement('div');
            orderDiv.className = 'order-control';
            
            const qtyWrapper = document.createElement('div');
            qtyWrapper.className = 'qty-wrapper';
            
            const decrementBtn = document.createElement('button');
            decrementBtn.textContent = '−';
            decrementBtn.className = 'qty-btn';
            decrementBtn.addEventListener('click', () => changeQuantity(i, -1));
            
            const qtyInput = document.createElement('input');
            qtyInput.type = 'text'; // menggunakan text untuk mencegah spinner ganjil
            qtyInput.className = 'qty-input';
            qtyInput.id = `qty-${i}`;
            qtyInput.value = quantities[i];
            qtyInput.addEventListener('input', (e) => {
                let val = parseInt(e.target.value, 10);
                if (isNaN(val)) val = 0;
                if (val < 0) val = 0;
                if (val > 99) val = 99;
                qtyInput.value = val;
                setQuantityManually(i, val);
            });
            
            const incrementBtn = document.createElement('button');
            incrementBtn.textContent = '+';
            incrementBtn.className = 'qty-btn';
            incrementBtn.addEventListener('click', () => changeQuantity(i, 1));
            
            qtyWrapper.appendChild(decrementBtn);
            qtyWrapper.appendChild(qtyInput);
            qtyWrapper.appendChild(incrementBtn);
            
            const itemTotalSpan = document.createElement('div');
            itemTotalSpan.className = 'item-total';
            const subtotalValue = item.price * quantities[i];
            itemTotalSpan.innerHTML = `💰 total: <span id="itemTotal-${i}">${formatRupiah(subtotalValue)}</span>`;
            
            orderDiv.appendChild(qtyWrapper);
            orderDiv.appendChild(itemTotalSpan);
            
            infoDiv.appendChild(namePriceDiv);
            infoDiv.appendChild(orderDiv);
            
            card.appendChild(imgDiv);
            card.appendChild(infoDiv);
            gridContainer.appendChild(card);
        }
        // setelah render, pastikan semua total terupdate
        updateAllTotals();
    }

    // inisialisasi dan event global
    function init() {
        renderMenu();
        const checkoutBtn = document.getElementById('checkoutBtn');
        const resetBtn = document.getElementById('resetAllBtn');
        if (checkoutBtn) checkoutBtn.addEventListener('click', checkout);
        if (resetBtn) resetBtn.addEventListener('click', resetAllOrders);
        
        // tambahkan sentuhan : notifikasi awal
        const notifDiv = document.getElementById('globalNotif');
        notifDiv.innerHTML = "✨ 10 minuman spesial! Pilih jumlah masing-masing menu. ✨";
        setTimeout(() => {
            if (calculateGrandTotal() === 0) notifDiv.innerHTML = "☕ Klik + untuk memesan, subtotal akan langsung terakumulasi!";
        }, 2000);
    }
    
    init();
</script>
</body>
</html>
